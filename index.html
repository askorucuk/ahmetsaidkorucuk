<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ahmet Said Korucuk için sinematik, interaktif, nöral portfolyo deneyimi."
    />
    <meta name="theme-color" content="#03050c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Ahmet Said Korucuk | Get Contact</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.setTimeout(function () {
        var root = document.getElementById('root');
        if (!root || root.children.length > 0 || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          return;
        }

        var stylesheet = document.createElement('link');
        stylesheet.rel = 'stylesheet';
        stylesheet.href = '/assets/index.css';
        document.head.appendChild(stylesheet);

        var fallbackScript = document.createElement('script');
        fallbackScript.type = 'module';
        fallbackScript.src = '/assets/index.js';
        document.body.appendChild(fallbackScript);
      }, 800);
    </script>
  </body>
</html>
